# Foot terminal configuration
# Fast, lightweight Wayland terminal emulator

[main]
font=Hack:size=10
dpi-aware=yes
pad=0x0

[scrollback]
lines=8192

[cursor]
style=underline
blink=yes

[mouse]
hide-when-typing=yes

[colors]
# Based on Solarized Dark color scheme from .Xresources

# Background with transparency (alpha value: 0-1)
alpha=0.95
background=002b36
foreground=93a1a1

## Normal/regular colors
regular0=002b36  # black
regular1=dc322f  # red
regular2=859900  # green
regular3=b58900  # yellow
regular4=268bd2  # blue
regular5=6c71c4  # magenta
regular6=2aa198  # cyan
regular7=93a1a1  # white

## Bright colors
bright0=657b83   # bright black
bright1=dc322f   # bright red
bright2=859900   # bright green
bright3=b58900   # bright yellow
bright4=268bd2   # bright blue
bright5=6c71c4   # bright magenta
bright6=2aa198   # bright cyan
bright7=fdf6e3   # bright white

[url]
launch=chromium --enable-features=UseOzonePlatform --ozone-platform=wayland ${url}
protocols=http, https, ftp, ftps, file

[key-bindings]
# Clipboard shortcuts
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

# Scrollback
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down

# Font size
increase-font-size=Control+plus Control+equal Control+KP_Add
decrease-font-size=Control+minus Control+KP_Subtract
reset-font-size=Control+0 Control+KP_0

[tweak]
# Performance optimizations for fast rendering
render-timer=none
