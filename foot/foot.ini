# Foot terminal configuration
# Fast, lightweight Wayland terminal emulator

[main]
font=Hack:size=10
dpi-aware=yes
pad=0x0

[scrollback]
lines=8192

[cursor]
style=underline
blink=yes

[mouse]
hide-when-typing=yes

[colors]
# Transparent black background (like urxvt on X11)

# Background with transparency (alpha value: 0-1, lower = more transparent)
# Adjust alpha to taste: 0.85 = more transparent, 0.95 = less transparent
alpha=0.90
background=000000  # Pure black so wallpaper shows through
foreground=ffffff  # White text for good contrast on black

## Normal/regular colors (adjusted for black background)
regular0=000000  # black
regular1=cc0000  # red
regular2=4e9a06  # green
regular3=c4a000  # yellow
regular4=3465a4  # blue
regular5=75507b  # magenta
regular6=06989a  # cyan
regular7=d3d7cf  # white

## Bright colors
bright0=555753   # bright black (gray)
bright1=ef2929   # bright red
bright2=8ae234   # bright green
bright3=fce94f   # bright yellow
bright4=729fcf   # bright blue
bright5=ad7fa8   # bright magenta
bright6=34e2e2   # bright cyan
bright7=eeeeec   # bright white

[url]
launch=chromium --enable-features=UseOzonePlatform --ozone-platform=wayland ${url}

[key-bindings]
# Clipboard shortcuts
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

# Scrollback
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down

# Font size
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[tweak]
# Performance optimizations for fast rendering
render-timer=none
